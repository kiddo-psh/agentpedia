# Site-wide glossary. Articles mark a term at first use with <Term id="...">.
# definition: one or two plain sentences (max 200 chars), written for a developer new to the topic.

- id: mcp
  term: MCP
  en: Model Context Protocol
  definition: AI 에이전트가 외부 도구와 데이터에 접속하는 표준 규약입니다. MCP 서버를 연결하면 에이전트가 그 서버의 도구를 호출할 수 있습니다.

- id: agent-plugin
  term: 에이전트 플러그인
  en: agent plugin
  definition: Claude Code나 Codex 같은 코딩 에이전트에 스킬, 훅, MCP 서버 등을 한꺼번에 추가하는 묶음입니다. 설치하면 에이전트의 행동 방식이 바뀝니다.

- id: agent-hook
  term: 훅
  en: hook
  definition: 세션 시작이나 도구 실행 같은 시점에 에이전트가 자동으로 실행하는 명령입니다. 훅의 출력은 에이전트에게 지시처럼 전달될 수 있습니다.

- id: trust-boundary
  term: 신뢰 경계
  en: trust boundary
  definition: 믿을 수 있는 영역과 그렇지 않은 영역이 갈리는 선입니다. 이 선을 넘는 데이터나 코드는 검사하고 승인을 받아야 합니다.

- id: supply-chain-attack
  term: 공급망 공격
  en: supply chain attack
  definition: 대상을 직접 공격하지 않고, 대상이 믿고 설치하는 패키지나 확장 프로그램, 업데이트에 악성 코드를 심는 공격입니다.

- id: reverse-ssh-tunnel
  term: 리버스 SSH 터널
  en: reverse SSH tunnel
  definition: 감염된 컴퓨터가 공격자 서버로 먼저 SSH 연결을 열고, 그 연결을 거꾸로 타고 공격자가 들어오게 하는 방법입니다. 방화벽의 들어오는 연결 차단을 우회합니다.

- id: persistence
  term: 지속성 확보
  en: persistence
  definition: 재부팅하거나 원인 프로그램을 지워도 악성 코드가 다시 실행되도록 시작 프로그램이나 예약 작업 등에 자신을 등록하는 것입니다.

- id: cli
  term: CLI
  en: Command-Line Interface
  definition: 터미널에서 명령으로 프로그램을 쓰는 인터페이스입니다. 코딩 에이전트는 셸 명령을 잘 다뤄 API를 감싼 CLI를 쉽게 씁니다.

- id: agent-skill
  term: 에이전트 스킬
  en: Agent Skill
  definition: 에이전트에게 특정 도구나 작업의 쓰는 법을 알려 주는 SKILL.md 중심의 설명 묶음입니다. Claude Code나 Codex가 필요할 때 읽습니다.

- id: trustmrr
  term: TrustMRR
  definition: 창업자가 Stripe API 키를 연결해 매출을 검증해 공개하는 서비스입니다. 스크린샷이 아닌 결제 기록에서 계산합니다.

- id: mrr
  term: MRR
  en: Monthly Recurring Revenue
  definition: 구독으로 매달 반복해서 들어오는 매출입니다. 월 매출(실제 청구액)과는 다를 수 있습니다.

- id: context-file
  term: 컨텍스트 파일
  en: context file
  definition: CLAUDE.md, AGENTS.md처럼 저장소 루트에 두고 코딩 에이전트가 작업 전에 읽는 지침 파일입니다.

- id: ablation-study
  term: 절제 연구
  en: ablation study
  definition: 시스템의 한 요소만 빼거나 바꿔 가며 결과가 어떻게 달라지는지 비교하는 실험입니다.

- id: swe-bench
  term: SWE-bench
  en: SWE-bench
  definition: 실제 GitHub 이슈를 에이전트가 해결하는지 테스트로 채점하는 코딩 에이전트 벤치마크입니다.

- id: equivalence-testing
  term: 동등성 검정
  en: equivalence testing (TOST)
  definition: 두 조건에 차이가 없다고 주장하기 위해, 차이가 정해 둔 범위 안에 든다는 것을 보이는 통계 검정입니다.

- id: statistical-power
  term: 검정력
  en: statistical power
  definition: 실제로 있는 효과를 표본에서 찾아낼 확률입니다. 표본이 작으면 낮아서 효과가 없다는 결론을 믿기 어렵습니다.

- id: inference-cost
  term: 추론 비용
  en: inference cost
  definition: 에이전트가 작업하며 쓴 토큰과 호출에 드는 비용입니다. 단계와 추론 토큰이 늘면 함께 커집니다.

- id: sandbox
  term: 샌드박스
  en: sandbox
  definition: 코드를 실행하되 외부 파일·네트워크에 영향을 주지 못하게 가둔 격리 환경입니다. OpenAI 글에서는 모델 작업을 실행하는 클라우드 가상 컴퓨터를 가리킵니다.

- id: ssrf
  term: SSRF
  en: server-side request forgery
  definition: 서버를 속여 공격자가 원하는 주소로 요청을 대신 보내게 하는 공격입니다. 이 사고에서는 패키지 서비스가 임의의 인터넷 요청을 보내게 됐습니다.

- id: zero-day
  term: 제로데이
  en: zero-day
  definition: 개발자도 아직 모르거나 패치가 없는 보안 취약점입니다.

- id: reward-hacking
  term: 보상 해킹
  en: reward hacking
  definition: 에이전트가 의도한 방식이 아니라 편법으로 높은 점수를 얻으려는 행동입니다. 이 사고의 주요 원인으로 지목됐습니다.

- id: cot-monitoring
  term: 추론 과정(CoT) 모니터링
  en: chain-of-thought monitoring
  definition: 모델의 추론 과정을 읽어 위험하거나 범위를 벗어난 행동을 감지하는 방법입니다.

- id: exploitgym
  term: ExploitGym
  en: ExploitGym
  definition: 에이전트가 소프트웨어 취약점을 악용해 플래그(정답)를 찾는 사이버 보안 평가입니다. 사고 당시 평가의 이름입니다.

- id: permission-deny-rule
  term: 권한 차단 규칙
  en: permission deny rule
  definition: 코딩 에이전트 설정에서 특정 명령, 파일, 네트워크 접근을 실행 자체가 안 되도록 막는 규칙입니다. 프롬프트 지시와 달리 도구가 강제합니다.

- id: agent-harness
  term: 하네스
  en: harness
  definition: 모델 바깥에서 에이전트 루프를 돌리는 코드입니다. 프롬프트, 도구 호출, 파일 시스템, 서브에이전트, 메모리처럼 모델에 컨텍스트를 공급하는 부분을 포함합니다.

- id: subagent
  term: 서브에이전트
  en: subagent
  definition: 메인 에이전트가 일을 나눠 맡기는 별도 에이전트입니다. 자체 컨텍스트로 작업하고 결과만 메인 에이전트에게 돌려줍니다.

- id: agent-middleware
  term: 미들웨어
  en: middleware
  definition: 에이전트 루프의 앞뒤 단계에 끼어들어 동작을 바꾸는 코드입니다. 요약, 컨텍스트 정리, 검증 같은 기능을 루프에 붙일 때 씁니다.

- id: code-mode
  term: 코드 모드
  en: Code Mode
  definition: 에이전트가 사람용 도구를 쓰는 대신 코드를 작성해 작업하는 방식입니다.

- id: agent-trace
  term: 트레이스
  en: trace
  definition: 에이전트가 실행 중 한 도구 호출, 컨텍스트 구성, 실행 단계를 시간순으로 남긴 기록입니다. 실패 원인을 컨텍스트에서 찾을 때 씁니다.

- id: service-account
  term: 서비스 계정
  en: service account
  definition: 사람이 아니라 프로그램이 쓰는 별도 계정입니다. 에이전트가 사용자 권한을 위임받아 일하는 방식과 대비해 논의됩니다.

- id: software-3-0
  term: Software 3.0
  definition: 카파시가 소프트웨어를 셋으로 나눈 틀입니다. 사람이 쓴 코드(1.0), 학습한 신경망 가중치(2.0)에 이어, 영어로 쓴 프롬프트가 LLM을 움직이는 프로그램이 됐다는 뜻입니다.

- id: partial-autonomy
  term: 부분 자율
  en: partial autonomy
  definition: AI가 일을 하되 사람이 결과를 확인하고 승인하는 방식입니다. AI에게 맡기는 범위를 자율성 슬라이더처럼 조금씩 넓혀 갑니다.

- id: context-window
  term: 컨텍스트 창
  en: context window
  definition: LLM이 한 번에 읽고 기억할 수 있는 입력의 범위입니다. 이 창을 벗어나거나 세션이 끝나면 모델은 그 내용을 잊습니다.

- id: prompt-injection
  term: 프롬프트 인젝션
  en: prompt injection
  definition: 웹 페이지나 문서 같은 입력에 지시문을 숨겨 LLM이 원래 사용자의 뜻과 다르게 행동하게 만드는 공격입니다.

- id: vibe-coding
  term: 바이브 코딩
  en: vibe coding
  definition: 코드를 한 줄씩 직접 쓰지 않고, 원하는 것을 말로 설명해 AI가 코드를 만들게 하는 개발 방식입니다. 카파시가 붙인 이름입니다.

- id: llms-txt
  term: llms.txt
  definition: 사이트 루트에 두는 마크다운 파일로, LLM이 그 사이트의 핵심 문서를 찾아 읽게 안내합니다. 검색 로봇용 robots.txt에 빗댄 제안입니다.

- id: feedback-loop
  term: 피드백 루프
  en: feedback loop
  definition: 에이전트가 작업한 뒤 테스트나 실행으로 결과를 직접 확인하고, 그 결과를 보고 다시 고치는 반복입니다. 사람이 확인하기 전에 에이전트가 스스로 오류를 잡습니다.

- id: plan-mode
  term: 계획 모드
  en: plan mode
  definition: 코딩 에이전트가 파일을 고치지 않고 코드를 읽으며 구현 계획만 세우는 모드입니다. 계획이 정해지면 일반 모드로 바꿔 구현합니다.

- id: slash-command
  term: 슬래시 명령
  en: slash command
  definition: 채팅 입력창에 `/이름`으로 실행하는 미리 정의한 프롬프트입니다. Claude Code에서는 `.claude/commands/`에 마크다운 파일로 만들어 팀과 공유합니다.

- id: extended-thinking
  term: 확장 사고
  en: extended thinking
  definition: 모델이 답하기 전에 추론 과정을 길게 거치도록 하는 기능입니다. 켜면 느려지고 토큰을 더 쓰지만 어려운 작업의 정확도가 올라갑니다.

- id: reasoning-effort
  term: 추론 수준
  en: reasoning effort
  definition: 모델이 답하기 전에 생각에 쓸 노력의 정도를 정하는 설정입니다. low, medium, high처럼 고르며, 높을수록 느리고 비용이 큽니다.

- id: compaction
  term: 컴팩션
  en: compaction
  definition: 대화가 컨텍스트 창을 채우면 지난 내용을 요약해 줄이고 작업을 이어 가는 기능입니다. 긴 작업을 한 세션에서 계속할 수 있게 합니다.

- id: knowledge-cutoff
  term: 지식 컷오프
  en: knowledge cutoff
  definition: 모델이 학습한 데이터의 마지막 시점입니다. 그 뒤에 나온 라이브러리나 사건은 모델이 따로 검색하지 않으면 모릅니다.

- id: git-worktree
  term: 워크트리
  en: git worktree
  definition: 한 git 저장소에서 여러 브랜치를 서로 다른 폴더에 동시에 꺼내 두는 기능입니다. 에이전트 여러 개가 같은 레포에서 충돌 없이 따로 일할 때 씁니다.
