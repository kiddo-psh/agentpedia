name: collect-ideas

on:
  schedule:
    # Monday 00:00 UTC = Monday 09:00 Asia/Seoul (KST, UTC+9)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run ideas:collect -- --limit 30
      - name: Commit ideas.yaml if changed
        run: |
          if git diff --quiet -- content/ideas.yaml; then
            echo "no idea changes; skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ideas.yaml
          git commit -m "content: refresh ideas backlog from weekly collect"
          git push
      - run: npm run agents:refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit agent facts if changed
        run: |
          if git diff --quiet -- content/agents; then
            echo "no agent fact changes; skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/agents
          git commit -m "content: refresh agent npm downloads and GitHub facts"
          git push
